<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Codex 控制台</title>
    <style>
      :root {
        --bg: #f3f5f7;
        --bg-soft: #fafbfc;
        --panel: #ffffff;
        --line: #e6eaef;
        --line-strong: #d9dfe7;
        --text: #111111;
        --text-soft: #2f3640;
        --muted: #6b7280;
        --muted-light: #98a1ae;
        --accent: #16a34a;
        --accent-soft: #edf9f0;
        --warn: #d97706;
        --warn-soft: #fff7ed;
        --danger: #dc2626;
        --danger-soft: #fef2f2;
        --shadow: 0 1px 2px rgba(15, 23, 42, 0.04);
        --radius-lg: 10px;
        --radius-md: 8px;
        --radius-sm: 6px;
        --space-1: 6px;
        --space-2: 10px;
        --space-3: 14px;
        --space-4: 18px;
        --space-5: 24px;
        --space-6: 32px;
        --mono: "IBM Plex Mono", "SFMono-Regular", "Cascadia Mono", monospace;
        --sans: "IBM Plex Sans", "PingFang SC", "Microsoft YaHei", sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        min-height: 100%;
      }

      html {
        scrollbar-gutter: stable both-edges;
      }

      body {
        font-family: var(--sans);
        color: var(--text);
        background: linear-gradient(180deg, #f7f8fa 0%, #f1f4f6 100%);
        overflow-y: scroll;
      }

      [hidden] {
        display: none !important;
      }

      button,
      input,
      select {
        font: inherit;
      }

      a {
        color: inherit;
        text-decoration: none;
      }

      .drawer-backdrop {
        position: fixed;
        inset: 0;
        background: rgba(15, 23, 42, 0.18);
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.16s ease;
        z-index: 20;
      }

      body.nav-open .drawer-backdrop {
        opacity: 1;
        pointer-events: auto;
      }

      .auth-shell {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px 16px;
      }

      .auth-panel {
        width: min(428px, 100%);
        padding: 24px;
        border: 1px solid var(--line);
        border-radius: 12px;
        background: #fff;
        box-shadow: var(--shadow);
        display: grid;
        gap: 18px;
      }

      .bootstrap-panel {
        width: min(980px, 100%);
        padding: 22px;
        border: 1px solid var(--line);
        border-radius: 12px;
        background: #fff;
        box-shadow: var(--shadow);
        display: grid;
        gap: 16px;
      }

      .auth-copy {
        display: grid;
        gap: 8px;
      }

      .auth-title {
        margin: 0;
        font-size: 24px;
        font-weight: 600;
        letter-spacing: -0.04em;
      }

      .auth-description {
        margin: 0;
        color: var(--muted);
        font-size: 13px;
        line-height: 1.7;
      }

      .auth-form {
        display: grid;
        gap: 12px;
      }

      .auth-status {
        min-height: 42px;
        padding: 10px 12px;
        border: 1px solid var(--line);
        border-radius: var(--radius-sm);
        background: var(--bg-soft);
        color: var(--muted);
        font-size: 12px;
        line-height: 1.6;
      }

      .auth-status.ok {
        color: #15803d;
        border-color: #d8f7e4;
        background: var(--accent-soft);
      }

      .auth-status.warn {
        color: #b45309;
        border-color: #fde3c1;
        background: var(--warn-soft);
      }

      .auth-status.bad {
        color: #b91c1c;
        border-color: #fecaca;
        background: var(--danger-soft);
      }

      .backend-shell {
        width: 100%;
        min-height: 100vh;
        padding: 10px 0 14px;
      }

      .app-shell {
        width: min(1560px, calc(100% - 20px));
        min-height: calc(100vh - 24px);
        margin: 0 auto;
        display: grid;
        grid-template-columns: 188px minmax(0, 1fr);
        gap: var(--space-3);
        align-items: start;
      }

      .sidebar,
      .panel,
      .stat-card,
      .table-shell,
      .empty-box {
        background: var(--panel);
        border: 1px solid var(--line);
        box-shadow: var(--shadow);
      }

      .sidebar {
        position: sticky;
        top: 10px;
        align-self: start;
        height: fit-content;
        max-height: calc(100vh - 24px);
        overflow-y: auto;
        padding: 12px;
        border-radius: var(--radius-lg);
        display: grid;
        align-content: start;
        gap: var(--space-2);
      }

      .brand {
        display: grid;
        gap: 4px;
      }

      .brand-kicker,
      .section-kicker,
      .stat-label,
      .field-label,
      th {
        font-size: 12px;
        letter-spacing: 0.04em;
        color: var(--muted);
      }

      .brand-title {
        font-size: 18px;
        font-weight: 600;
        letter-spacing: -0.035em;
      }

      .brand-note,
      .helper,
      .meta-note,
      .empty-box,
      .subtle {
        color: var(--muted);
        font-size: 12px;
        line-height: 1.65;
      }

      .nav {
        display: grid;
        gap: 4px;
      }

      .nav-link {
        display: flex;
        align-items: center;
        justify-content: space-between;
        min-height: 34px;
        padding: 0 10px;
        border-radius: var(--radius-sm);
        border: 1px solid transparent;
        color: var(--text-soft);
        font-size: 13px;
      }

      .nav-link:hover {
        background: var(--bg-soft);
        border-color: var(--line);
      }

      .nav-link:focus-visible,
      .button:focus-visible,
      input[type="text"]:focus-visible,
      input[type="password"]:focus-visible,
      input[type="number"]:focus-visible,
      input[type="file"]:focus-visible,
      textarea:focus-visible,
      select:focus-visible,
      input[type="checkbox"]:focus-visible {
        outline: 2px solid rgba(22, 163, 74, 0.32);
        outline-offset: 2px;
      }

      .nav-link.active {
        color: #166534;
        background: var(--accent-soft);
        border-color: #d8efdf;
        font-weight: 600;
      }

      .sidebar-group {
        padding: 10px;
        border-radius: var(--radius-md);
        border: 1px solid var(--line);
        background: var(--bg-soft);
        display: grid;
        gap: 8px;
      }

      .section-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
      }

      .section-head h2,
      .panel h3,
      .table-title {
        margin: 0;
        font-size: 15px;
        font-weight: 600;
        letter-spacing: -0.02em;
      }

      .status-pill,
      .status-dot-pill,
      .plan-pill,
      .small-pill {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        min-height: 24px;
        padding: 0 8px;
        border-radius: 999px;
        border: 1px solid var(--line);
        background: #fff;
        color: var(--text-soft);
        font-size: 11px;
        white-space: nowrap;
      }

      .status-pill.ok,
      .status-dot-pill.ok {
        color: #15803d;
        background: var(--accent-soft);
        border-color: #d8f7e4;
      }

      .status-pill.warn,
      .status-dot-pill.warn {
        color: #b45309;
        background: var(--warn-soft);
        border-color: #fde3c1;
      }

      .status-pill.bad,
      .status-dot-pill.bad {
        color: #b91c1c;
        background: var(--danger-soft);
        border-color: #fecaca;
      }

      .dot {
        width: 8px;
        height: 8px;
        border-radius: 999px;
        background: currentColor;
      }

      .field {
        display: grid;
        gap: 6px;
      }

      input[type="text"],
      input[type="password"],
      input[type="number"],
      textarea {
        width: 100%;
        padding: 0 10px;
        border: 1px solid var(--line-strong);
        border-radius: var(--radius-sm);
        background: #fff;
        color: var(--text);
        outline: none;
      }

      input[type="text"],
      input[type="password"],
      input[type="number"] {
        min-height: 34px;
      }

      textarea {
        min-height: 96px;
        padding-top: 10px;
        padding-bottom: 10px;
        resize: vertical;
        line-height: 1.6;
      }

      select {
        min-height: 34px;
        padding: 0 10px;
        border: 1px solid var(--line-strong);
        border-radius: var(--radius-sm);
        background: #fff;
        color: var(--text);
        outline: none;
      }

      input[type="text"]:focus,
      input[type="password"]:focus,
      input[type="number"]:focus,
      textarea:focus {
        border-color: #9ed9b4;
        box-shadow: 0 0 0 3px rgba(34, 197, 94, 0.12);
      }

      input[type="file"] {
        width: 100%;
        color: var(--muted);
      }

      .visually-hidden-file {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }

      .switch-row {
        display: flex;
        align-items: center;
        gap: 10px;
        color: var(--text-soft);
        font-size: 13px;
      }

      .button-row {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }

      .button {
        min-height: 32px;
        padding: 0 10px;
        border-radius: var(--radius-sm);
        border: 1px solid transparent;
        cursor: pointer;
        transition: background 0.16s ease, border-color 0.16s ease, color 0.16s ease;
        font-size: 12px;
        font-weight: 500;
      }

      .button:disabled {
        cursor: wait;
        opacity: 0.65;
      }

      .button-primary {
        background: #111827;
        border-color: #111827;
        color: #fff;
      }

      .button-primary:hover {
        background: #0f172a;
      }

      .button-secondary {
        background: #fff;
        border-color: var(--line-strong);
        color: var(--text);
      }

      .button-secondary:hover {
        background: #f8fafc;
      }

      .button-danger {
        background: #fff;
        border-color: #f4c2c2;
        color: var(--danger);
      }

      .button-danger:hover {
        background: #fff7f7;
      }

      .main-shell {
        min-height: calc(100vh - 24px);
        display: grid;
        grid-template-rows: auto minmax(0, 1fr);
        gap: var(--space-3);
        min-width: 0;
      }

      .page-header {
        padding: 12px 14px;
        border: 1px solid var(--line);
        border-radius: var(--radius-md);
        background: #fff;
        box-shadow: var(--shadow);
      }

      .page-header-grid {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 12px;
        align-items: start;
      }

      .page-header-main {
        min-width: 0;
        display: flex;
        gap: 10px;
        align-items: start;
      }

      .page-header-copy {
        min-width: 0;
        flex: 1 1 auto;
      }

      .page-title {
        margin: 1px 0 0;
        font-size: 18px;
        font-weight: 600;
        letter-spacing: -0.03em;
      }

      .page-description {
        margin: 4px 0 0;
        max-width: 620px;
        color: var(--muted);
        font-size: 12px;
        line-height: 1.6;
      }

      .mobile-menu {
        display: none;
      }

      .page-actions {
        display: flex;
        flex-wrap: wrap;
        justify-content: flex-end;
        gap: 6px;
        align-self: start;
      }

      .view {
        display: grid;
        gap: var(--space-3);
        min-height: 0;
        align-content: start;
      }

      .view[data-route="dashboard"] {
        grid-auto-rows: max-content;
      }

      .view[data-route="quota"] {
        grid-template-rows: minmax(0, 1fr);
      }

      .view[data-route="import"] {
        grid-template-rows: auto minmax(180px, 1fr) minmax(180px, 1fr);
      }

      .view[data-route="logs"] {
        grid-template-rows: auto minmax(0, 1fr);
      }

      .view[data-route="config"] {
        grid-auto-rows: max-content;
      }

      .view[data-route="import"] > .table-shell,
      .view[data-route="logs"] > .table-shell {
        min-height: 0;
        display: grid;
        grid-template-rows: auto minmax(0, 1fr);
      }

      .view[data-route="quota"] > .table-shell {
        min-height: 0;
        display: grid;
        grid-template-rows: auto auto minmax(0, 1fr);
      }

      .view[data-route="quota"] .table-wrap,
      .view[data-route="import"] .table-wrap,
      .view[data-route="logs"] .table-wrap,
      .view[data-route="quota"] .empty-box,
      .view[data-route="import"] .empty-box,
      .view[data-route="logs"] .empty-box {
        min-height: 0;
      }

      .view[data-route="quota"] > .table-shell > .table-wrap,
      .view[data-route="quota"] > .table-shell > .empty-box,
      .view[data-route="import"] > .table-shell > .table-wrap,
      .view[data-route="import"] > .table-shell > .empty-box,
      .view[data-route="logs"] > .table-shell > .table-wrap,
      .view[data-route="logs"] > .table-shell > .empty-box {
        height: 100%;
      }

      .grid-4,
      .grid-2 {
        display: grid;
        gap: var(--space-2);
      }

      .grid-4 {
        grid-template-columns: repeat(4, minmax(0, 1fr));
      }

      .grid-2 {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .panel,
      .table-shell,
      .empty-box {
        border-radius: var(--radius-md);
      }

      .panel,
      .table-shell {
        padding: 12px;
      }

      .stat-card {
        padding: 12px;
        border-radius: var(--radius-md);
      }

      .stat-value {
        margin-top: 4px;
        font-size: 20px;
        font-weight: 600;
        letter-spacing: -0.04em;
      }

      .stat-value.small {
        font-size: 14px;
        line-height: 1.5;
      }

      .summary-row {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 8px;
      }

      .table-head {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 8px;
        margin-bottom: 8px;
        flex-wrap: wrap;
      }

      .quota-head {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(280px, 420px);
        align-items: start;
      }

      .quota-head-copy {
        min-width: 0;
      }

      .quota-toolbar-grid {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 152px auto;
        gap: 8px;
        align-items: end;
      }

      .toolbar-cell {
        display: grid;
        gap: 5px;
        min-width: 0;
      }

      .toolbar-cell.search {
        min-width: 0;
      }

      .quota-toolbar-actions {
        display: flex;
        justify-content: flex-end;
      }

      .quota-toolbar-actions .button {
        min-width: 116px;
      }

      .toolbar-meta {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 6px;
        margin-top: 8px;
      }

      .table-wrap {
        overflow: auto;
        border: 1px solid var(--line);
        border-radius: var(--radius-md);
      }

      table {
        width: 100%;
        border-collapse: collapse;
        background: #fff;
      }

      .quota-table {
        table-layout: fixed;
        min-width: 0;
      }

      .quota-table th,
      .quota-table td {
        text-align: center;
        vertical-align: middle;
      }

      th,
      td {
        padding: 8px 10px;
        border-bottom: 1px solid var(--line);
        text-align: left;
        vertical-align: top;
      }

      th {
        background: #fbfcfd;
        font-weight: 600;
        white-space: nowrap;
        position: sticky;
        top: 0;
        z-index: 1;
      }

      td {
        color: var(--text-soft);
        font-size: 12.5px;
        line-height: 1.5;
      }

      tr:last-child td {
        border-bottom: none;
      }

      .row-title {
        font-size: 13.5px;
        font-weight: 600;
        color: var(--text);
        line-height: 1.35;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .row-subtitle {
        margin-top: 3px;
        color: var(--muted);
        font-size: 10.5px;
        line-height: 1.45;
        min-height: 30px;
        overflow: hidden;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        word-break: break-word;
      }

      .quota-stack {
        display: grid;
        gap: 6px;
        min-width: 0;
      }

      .quota-table .quota-stack {
        width: 100%;
        justify-items: stretch;
        align-items: center;
      }

      .quota-inline-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 8px;
        min-width: 0;
        align-items: stretch;
      }

      .quota-inline-grid.single {
        grid-template-columns: minmax(0, 1fr);
      }

      .quota-table td.quota-cell {
        text-align: left;
      }

      .quota-meter {
        display: grid;
        gap: 6px;
        min-height: 0;
        padding: 0;
        border: none;
        border-radius: 0;
        background: transparent;
      }

      .quota-meter-top {
        display: grid;
        grid-template-columns: auto minmax(0, 1fr) auto;
        align-items: center;
        gap: 12px;
        min-width: 0;
      }

      .quota-meter-top strong {
        color: var(--text);
        font-size: 16px;
        line-height: 1;
        letter-spacing: -0.04em;
      }

      .quota-meter-time {
        min-width: 0;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        text-align: right;
        font-family: var(--mono);
        color: var(--text-soft);
        font-size: 11px;
      }

      .quota-meter-unit {
        display: inline-flex;
        align-items: center;
        justify-content: flex-end;
        color: var(--muted);
        font-size: 11px;
        font-weight: 600;
      }

      .quota-track {
        height: 6px;
        border-radius: 999px;
        background: #eceff3;
        overflow: hidden;
      }

      .quota-fill {
        height: 100%;
        border-radius: inherit;
      }

      .quota-fill.high {
        background: #22c55e;
      }

      .quota-fill.medium {
        background: #84cc16;
      }

      .quota-fill.low {
        background: #d97706;
      }

      .quota-placeholder,
      .cell-message {
        color: var(--muted);
        font-size: 11px;
        line-height: 1.5;
        min-height: 42px;
        display: flex;
        align-items: center;
        padding: 0 10px;
        border: 1px dashed var(--line);
        border-radius: 8px;
        background: #fbfcfd;
      }

      .quota-table-wrap {
        overflow-x: hidden;
        overflow-y: auto;
      }

      .plan-pill.compact,
      .status-pill.compact {
        min-height: 22px;
        padding: 0 7px;
        font-size: 10.5px;
      }

      .cell-message.error {
        color: var(--danger);
        border-color: #f5c2c2;
        background: #fff7f7;
      }

      .quota-note {
        color: var(--muted);
        font-size: 10.5px;
        line-height: 1.45;
      }

      .quota-note.warn {
        color: var(--warn);
      }

      .quota-note.bad {
        color: var(--danger);
      }

      .actions-col {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 6px;
        min-width: 108px;
        margin: 0 auto;
      }

      .actions-col .button {
        min-height: 28px;
        width: 100%;
        padding: 0 8px;
        font-size: 11px;
      }

      .actions-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 6px;
      }

      .quota-table .row-title,
      .quota-table .row-subtitle {
        text-align: center;
      }

      .quota-table td.account-col .row-title,
      .quota-table td.account-col .row-subtitle {
        text-align: left;
      }

      .quota-table td.account-col .row-subtitle {
        min-height: 0;
      }

      .file-picker {
        display: grid;
        gap: 6px;
      }

      .import-workbench {
        display: grid;
        gap: var(--space-3);
      }

      .import-guide {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }

      .import-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: var(--space-3);
      }

      .import-panel {
        display: grid;
        gap: var(--space-3);
      }

      .import-panel-head,
      .import-panel-body {
        display: grid;
        gap: var(--space-2);
      }

      .result-stack {
        display: grid;
        gap: var(--space-2);
      }

      .result-summary {
        display: grid;
        gap: var(--space-2);
        padding: 12px;
        border: 1px solid var(--line);
        border-radius: var(--radius-sm);
        background: #fbfcfd;
      }

      .result-summary-copy {
        color: var(--text-soft);
        font-size: 13px;
        line-height: 1.65;
      }

      .result-summary-pills {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }

      .config-grid,
      .config-form-grid {
        display: grid;
        gap: 10px;
      }

      .config-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .config-form-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .config-panel {
        display: grid;
        gap: 12px;
        padding: 12px;
        border: 1px solid var(--line);
        border-radius: var(--radius-md);

      .config-panel.full {

      .config-status {

        border: 1px solid var(--line);

      .field.span-2 {

      }

      .config-kv {

      .file-picker-row,

        gap: 8px;

      .file-picker-summary {
        min-height: 32px;
        display: flex;
        align-items: center;
        padding: 0 10px;

        font-size: 12px;
        line-height: 1.5;

      .log-list {

        gap: 6px;
      }

      .log-item {
        border: 1px solid var(--line);
        border-radius: var(--radius-sm);
        background: #fff;
        padding: 10px 12px;
      }

      .log-item time {
        display: block;

      .log-item p {

      .log-item.error {

      }

      .log-item.warn {
        border-color: #fed7aa;

      }

      .empty-box {
        padding: 18px;
        text-align: center;
      }

      .inline-link {
        color: #15803d;
        font-size: 12px;
      }

      .mono {
        font-family: var(--mono);
      }

      .overview-label {
        color: var(--muted);
        font-size: 11px;
        line-height: 1.45;
      }

      .overview-value {
        font-size: 17px;
        font-weight: 600;
        letter-spacing: -0.03em;
        color: var(--text);
        text-align: right;
      }

      .overview-value.sync {
        font-size: 11px;
        line-height: 1.45;
        letter-spacing: 0;
        color: var(--text-soft);
      }

      .sidebar-summary {
        gap: var(--space-2);
      }

      .summary-inline {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: var(--space-2);
      }

      .summary-inline-item {
        display: grid;
        gap: 4px;
        padding: 8px;
        border: 1px solid var(--line);
        border-radius: var(--radius-sm);
        background: #fff;
      }

      .summary-inline-value {
        display: flex;
        align-items: baseline;
        gap: 4px;
        font-size: 18px;
        font-weight: 600;
        letter-spacing: -0.03em;
        color: var(--text);
      }

      .summary-inline-value small {
        color: var(--muted);
        font-size: 11px;
        font-weight: 500;
        letter-spacing: 0;
      }

      .summary-inline-foot {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: var(--space-2);
        flex-wrap: wrap;
      }

      .quick-note {
        color: var(--muted);
        font-size: 11px;
        line-height: 1.5;
      }

      .dashboard-hero-grid {
        display: grid;
        grid-template-columns: minmax(0, 1.75fr) minmax(280px, 0.95fr);
        gap: var(--space-3);
      }

      .dashboard-primary {
        display: grid;
        gap: var(--space-3);
        padding: 16px;
        background: linear-gradient(180deg, #ffffff 0%, #f8faf9 100%);
        border-color: #dde5df;
      }

      .dashboard-primary.warn {
        background: linear-gradient(180deg, #ffffff 0%, #fffaf3 100%);
        border-color: #efd8ba;
      }

      .dashboard-primary.bad {
        background: linear-gradient(180deg, #ffffff 0%, #fff8f8 100%);

      }

      .dashboard-primary-top {

        grid-template-columns: minmax(0, 1fr) auto;

      }

      .dashboard-primary-title {

        letter-spacing: -0.05em;
      }

      .dashboard-primary-description {

      }

      .dashboard-metric-strip {

      }

      .dashboard-inline-metric {

      .config-advanced summary {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: var(--space-2);

        list-style: none;
        font-size: 14px;
        font-weight: 600;
        color: var(--text);

      .config-advanced summary::-webkit-details-marker {
        display: none;
      }

      .config-advanced summary::after {
        content: "+";

        font-size: 18px;

      }

      .config-advanced-body {

        gap: var(--space-3);

      }

      .config-save-panel {
        display: grid;
        gap: var(--space-2);
      }

      .empty-state-card {
        display: grid;
        gap: var(--space-3);
        align-self: start;
      }

      .empty-state-copy {
        display: grid;
        gap: var(--space-1);
        max-width: 58ch;
      }

      .empty-state-copy p {
        margin: 0;
        color: var(--text-soft);
        font-size: 13px;

      }

        gap: var(--space-2);

      @media (max-width: 1200px) {
        .grid-4 {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }

        .dashboard-hero-grid {
          grid-template-columns: 1fr;
        }
      }

      @media (max-width: 980px) {
        .app-shell {
          width: min(calc(100% - 16px), 100%);
          margin: 8px auto 16px;
          grid-template-columns: 1fr;
        }

        .sidebar {
          position: fixed;
          inset: 8px auto 8px 8px;
          width: min(228px, calc(100vw - 32px));
          max-height: calc(100vh - 16px);
          overflow: auto;
          transform: translateX(calc(-100% - 24px));
          transition: transform 0.16s ease;

        body.nav-open .sidebar {
          transform: translateX(0);
        }

        .mobile-menu {
          display: inline-flex;

        .main-shell {

        }

        }

          grid-template-columns: 1fr;
        }

        .quota-toolbar-grid {
          grid-template-columns: minmax(0, 1fr) 152px;
        }

        .quota-toolbar-actions {

        }
      }

      @media (max-width: 760px) {
        .grid-4,
        .grid-2,
        .summary-inline,
        .dashboard-metric-strip,
        .import-grid,
        .config-grid,
        .config-form-grid,
        .config-kv {
          grid-template-columns: 1fr;
        }

        .field.span-2,
        .config-panel.full {
          grid-column: auto;
        }

        .quota-toolbar-grid {
          grid-template-columns: 1fr;
        }

        .quota-toolbar-actions {
          justify-content: flex-start;
        }

        .file-picker-row,
        .file-picker-grid {
          grid-template-columns: 1fr;
        }

        .table-wrap {
          border-radius: 10px;
        }

        .main-shell,
        .sidebar,
        .panel,
        .table-shell,
        .empty-box,
        .stat-card {
          padding-left: 10px;
          padding-right: 10px;
        }
      }
    </style>
  </head>
  <body>
    <section class="auth-shell" id="auth-shell">
      <section class="auth-panel">
        <div class="auth-copy">
          <div class="section-kicker">Codex 专用代理</div>

        </div>

          </div>
        </form>

        <div class="auth-status" id="auth-status">输入管理密钥后会自动进入后台；已保存的密钥下次会自动重试。</div>
      </section>
    </section>

    <section class="auth-shell" id="bootstrap-shell" hidden></section>

    <section class="backend-shell" id="backend-shell" hidden>
      <div class="drawer-backdrop" id="drawer-backdrop"></div>

      <div class="app-shell">
        <aside class="sidebar">
          <section class="brand">
            <div class="brand-kicker">Codex 专用代理</div>
            <div class="brand-title">Codex 控制台</div>
            <div class="brand-note">先看账号池健康，再处理额度、导入结果和关键配置。</div>
          </section>

          <nav class="nav" aria-label="主导航">
            <a class="nav-link" data-route-link="dashboard" href="#/dashboard">仪表盘</a>
            <a class="nav-link" data-route-link="quota" href="#/quota">账号额度</a>
            <a class="nav-link" data-route-link="import" href="#/import">账号导入</a>
            <a class="nav-link" data-route-link="config" href="#/config">配置管理</a>

          <section class="sidebar-group sidebar-summary">
            <div class="section-head">
              <h2>运行快照</h2>

              <div class="summary-inline-item">
                <div class="overview-label">可用 / 总数</div>
                <div class="summary-inline-value"><span id="quick-enabled">0</span><small>/ <span id="quick-accounts">0</span></small></div>
              </div>
              <div class="summary-inline-item">
                <div class="overview-label">累计请求</div>
                <div class="summary-inline-value" id="quick-requests">0</div>
              </div>
            </div>

              <div class="overview-label">最近同步</div>
              <div class="overview-value sync" id="quick-sync">未同步</div>

        <section class="main-shell">
          <header class="page-header page-header-grid">

                <div class="section-kicker">运营控制台</div>
                <h1 class="page-title" id="page-title">仪表盘</h1>
                <p class="page-description" id="page-description">查看账号池概况、请求用量和最近操作。</p>
              </div>

    <script>
      const STORAGE_KEY = "codex-console.management-key";
      const IMPORT_PATH_KEY = "codex-console.import-path";
      const AUTO_CLEANUP_KEY = "codex-console.auto-cleanup";
      const DEFAULT_IMPORT_PATH = "/data/import";
      const QUOTA_AUTO_REFRESH_INTERVAL_MS = 60 * 60 * 1000;

      const ROUTES = {
        dashboard: {
          title: "仪表盘",
          description: "先判断账号池是否健康，再决定是否刷新、清理或补号。",
        },
        quota: {
          title: "账号额度",
          description: "按账号查看套餐、健康状态和 5H / 7D 剩余额度。",
        },
        import: {
          title: "账号导入",
          description: "从服务器目录或浏览器批量导入 Codex 账号文件。",
        },
        config: {
          title: "配置管理",
          description: "先维护基础接入，再按需展开补号与进阶运行参数。",
        },
        logs: {
          title: "操作日志",
          description: "查看本地操作记录，确认刚才发生了什么。",
        },
      };

      function defaultConfigDraft() {
        return {
          host: "",
          port: 8317,
          tls: {
            enable: false,
            cert: "",
            key: "",
          },
          management: {
            allowRemote: true,
            secretKey: "",
            secretConfigured: false,
          },
          replenishment: {
            enabled: false,
            targetAccountCount: 10,
            checkIntervalSeconds: 300,
            quotaRefreshIntervalSeconds: 3600,
            cleanupInvalidAccounts: true,
            serviceUrl: "",
            serviceToken: "",
            serviceTokenConfigured: false,
          },
          authDir: "/data/auths",
          apiKeysText: "",
          proxyUrl: "",
          loggingToFile: false,
          logsMaxTotalSizeMB: 0,
          errorLogsMaxFiles: 10,
          usageStatisticsEnabled: true,
          requestLog: false,
          disableCooling: false,
          requestRetry: 3,
          maxRetryCredentials: 0,
          maxRetryInterval: 30,
          routingStrategy: "round-robin",
        };
      }

      const state = {
        key: localStorage.getItem(STORAGE_KEY) || "",
        bootstrapChecked: false,
        bootstrapRequired: false,
        bootstrapSaving: false,
        bootstrapError: "",
        authenticated: false,
        authChecking: false,
        authError: "",
        importPath: localStorage.getItem(IMPORT_PATH_KEY) || DEFAULT_IMPORT_PATH,
        autoCleanup: localStorage.getItem(AUTO_CLEANUP_KEY) !== "false",
        quotaQuery: "",
        quotaStatusFilter: "all",
        accounts: [],
        quotaByAccount: {},
        usage: null,
        replenishmentStatus: null,
        replenishmentLoading: false,
        replenishmentError: "",
        lastSync: "",
        lastImportResult: null,
        lastCleanupResult: null,
        logs: [],
        quotaRefreshInFlight: false,
        quotaAutoRefreshHandle: 0,
        quotaLastBulkRefreshAt: 0,
        configDraft: defaultConfigDraft(),
        configLoading: false,
        configSaving: false,
        configStatus: "",
        configStatusLevel: "",
        busy: false,
      };

      const elements = {
        body: document.body,
        authShell: document.getElementById("auth-shell"),
        bootstrapShell: document.getElementById("bootstrap-shell"),
        backendShell: document.getElementById("backend-shell"),
        authForm: document.getElementById("auth-form"),
        authKeyInput: document.getElementById("auth-management-key"),
        authSubmit: document.getElementById("auth-submit"),
        authClear: document.getElementById("auth-clear"),
        authStatus: document.getElementById("auth-status"),
        view: document.getElementById("view"),
        quickAccounts: document.getElementById("quick-accounts"),
        quickEnabled: document.getElementById("quick-enabled"),
        quickRequests: document.getElementById("quick-requests"),
        quickSync: document.getElementById("quick-sync"),
        pageTitle: document.getElementById("page-title"),
        pageDescription: document.getElementById("page-description"),
        navLinks: Array.from(document.querySelectorAll("[data-route-link]")),
      };

      function getRoute() {
        const route = String(window.location.hash || "").replace(/^#\/?/, "").trim();
        return ROUTES[route] ? route : "dashboard";
      }

      function ensureRoute() {
        const route = getRoute();
        if (window.location.hash !== `#/${route}`) {
          window.location.replace(`#/${route}`);
        }
      }

      function escapeHTML(value) {
        return String(value == null ? "" : value).replace(/[&<>"']/g, (char) => ({
          "&": "&amp;",
          "<": "&lt;",
          ">": "&gt;",
          "\"": "&quot;",
          "'": "&#39;",
        }[char]));
      }

      function formatCount(value) {
        const number = Number(value || 0);
        return Number.isFinite(number) ? number.toLocaleString("zh-CN") : "0";
      }

      function formatTime(value) {
        if (!value) return "未同步";
        const date = new Date(value);
        if (Number.isNaN(date.getTime())) return String(value);
        return date.toLocaleString("zh-CN", { hour12: false });
      }

      function formatRelativeTime(value) {
        if (!value) return "未同步";
        const date = new Date(value);
        if (Number.isNaN(date.getTime())) return String(value);
        const diff = Date.now() - date.getTime();
        const minute = 60 * 1000;
        const hour = 60 * minute;
        const day = 24 * hour;
        if (diff < minute) return "刚刚";
        if (diff < hour) return `${Math.max(1, Math.floor(diff / minute))} 分钟前`;
        if (diff < day) return `${Math.max(1, Math.floor(diff / hour))} 小时前`;
        return `${Math.max(1, Math.floor(diff / day))} 天前`;
      }

      function normalizeString(value) {
        if (typeof value === "string") {
          const trimmed = value.trim();
          return trimmed || null;
        }
        if (typeof value === "number" && Number.isFinite(value)) {
          return String(value);
        }
        return null;
      }

      function normalizeNumber(value) {
        if (typeof value === "number" && Number.isFinite(value)) {
          return value;
        }
        if (typeof value === "string") {
          const trimmed = value.trim();
          if (!trimmed) return null;
          const parsed = Number(trimmed);
          return Number.isFinite(parsed) ? parsed : null;
        }
        return null;
      }

      function normalizePlanType(value) {
        const normalized = normalizeString(value);
        return normalized ? normalized.toLowerCase() : null;
      }

      function resolvePlanLabel(value) {
        const normalized = normalizePlanType(value);
        if (normalized === "free") return "free";
        if (normalized === "plus") return "plus";
        if (normalized === "team") return "team";
        return normalizeString(value) || "--";
      }

      function cloneConfigDraft(value) {
        return JSON.parse(JSON.stringify(value || defaultConfigDraft()));
      }

      function configDraftFromPayload(payload) {
        const draft = defaultConfigDraft();
        const source = payload && typeof payload === "object" ? payload : {};
        const tls = source.tls && typeof source.tls === "object" ? source.tls : {};
        const management = source.management && typeof source.management === "object" ? source.management : {};
        const replenishment = source.replenishment && typeof source.replenishment === "object" ? source.replenishment : {};
        draft.host = normalizeString(source.host) || "";
        draft.port = normalizeNumber(source.port) || 8317;
        draft.tls.enable = Boolean(tls.enable);
        draft.tls.cert = normalizeString(tls.cert) || "";
        draft.tls.key = normalizeString(tls.key) || "";
        draft.management.allowRemote = management.allowRemote !== false;
        draft.management.secretConfigured = Boolean(management.secretConfigured);
        draft.management.secretKey = "";
        draft.replenishment.enabled = Boolean(replenishment.enabled);
        draft.replenishment.targetAccountCount = normalizeNumber(replenishment.targetAccountCount);
        if (draft.replenishment.targetAccountCount === null) draft.replenishment.targetAccountCount = 10;
        draft.replenishment.checkIntervalSeconds = normalizeNumber(replenishment.checkIntervalSeconds);
        if (draft.replenishment.checkIntervalSeconds === null) draft.replenishment.checkIntervalSeconds = 300;
        draft.replenishment.quotaRefreshIntervalSeconds = normalizeNumber(replenishment.quotaRefreshIntervalSeconds);
        if (draft.replenishment.quotaRefreshIntervalSeconds === null) draft.replenishment.quotaRefreshIntervalSeconds = 3600;

        draft.replenishment.serviceUrl = normalizeString(replenishment.serviceUrl) || "";
        draft.replenishment.serviceToken = "";
        draft.replenishment.serviceTokenConfigured = Boolean(replenishment.serviceTokenConfigured);
        draft.authDir = normalizeString(source.authDir) || draft.authDir;
        draft.apiKeysText = Array.isArray(source.apiKeys) ? source.apiKeys.map((item) => String(item || "").trim()).filter(Boolean).join("\n") : "";
        draft.proxyUrl = normalizeString(source.proxyUrl) || "";

      function setConfigField(path, value) {
        const draft = cloneConfigDraft(state.configDraft);
        let target = draft;
        const segments = path.split(".");
        for (let index = 0; index < segments.length - 1; index += 1) {
          const segment = segments[index];
          if (!target[segment] || typeof target[segment] !== "object") {
            target[segment] = {};
          }
          target = target[segment];
        }
        target[segments[segments.length - 1]] = value;
        state.configDraft = draft;
      }

      function resolveCodexAccountId(account) {
        return normalizeString(account && account.id_token && account.id_token.chatgpt_account_id);
      }

      function parseJSONValue(value) {
        if (value == null) return null;
        if (typeof value === "string") {
          const trimmed = value.trim();
          if (!trimmed) return null;
          try {
            return JSON.parse(trimmed);
          } catch (error) {
            return value;
          }
        }
        return value;
      }

      function getAPICallErrorMessage(result) {
        const statusCode = Number(result && (result.status_code || result.statusCode) || 0);
        const parsedBody = parseJSONValue(result && result.body);
        let message = "";

        if (parsedBody && typeof parsedBody === "object") {
          if (parsedBody.error && typeof parsedBody.error === "object" && typeof parsedBody.error.message === "string") {
            message = parsedBody.error.message;
          } else if (typeof parsedBody.error === "string") {
            message = parsedBody.error;
          } else if (typeof parsedBody.message === "string") {
            message = parsedBody.message;
          }
        } else if (typeof parsedBody === "string") {
          message = parsedBody.trim();
        }

        if (!message && typeof result.body === "string") {
          message = result.body.trim();
        }
        if (statusCode && message) {
          return `${statusCode} ${message}`.trim();
        }
        if (statusCode) {
          return `HTTP ${statusCode}`;
        }
        return message || "请求失败";
      }

      function formatQuotaErrorCopy(message) {
        const raw = String(message || "").trim();
        if (!raw) {
          return {
            summary: "刷新失败，请稍后重试",
            detail: "",
          };
        }

        let detail = raw
          .replace(/^HTTP\s+/i, "")
          .replace(/^\d+\s+/, "")
          .trim();

        const parsed = parseJSONValue(detail);
        if (parsed && typeof parsed === "object") {
          if (typeof parsed.detail === "string" && parsed.detail.trim()) {
            detail = parsed.detail.trim();
          } else if (typeof parsed.error === "string" && parsed.error.trim()) {
            detail = parsed.error.trim();
          } else if (typeof parsed.message === "string" && parsed.message.trim()) {
            detail = parsed.message.trim();
          }
        } else if (typeof parsed === "string" && parsed.trim()) {
          detail = parsed.trim();
        }

        const normalized = detail.toLowerCase();
        if (normalized.includes("could not parse your authentication token") || normalized.includes("please try signing in again")) {
          return {
            summary: "登录态已失效，请重新导入账号",
            detail: raw,
          };
        }

        if (normalized.includes("缺少 chatgpt 账号 id") || normalized.includes("缺少账号 id")) {
          return {
            summary: "缺少账号 ID，暂时无法查询额度",
            detail: raw,
          };
        }

        if (normalized.includes("暂无额度数据")) {
          return {
            summary: "接口暂未返回额度数据",
            detail: raw,
          };
        }

        return {
          summary: detail || "刷新失败，请稍后重试",
          detail: raw,
        };
      }

      function formatQuotaResetLabel(window) {
        if (!window || typeof window !== "object") return "--";

        const resetAt = normalizeNumber(window.reset_at || window.resetAt);
        if (resetAt !== null) {
          const date = new Date(resetAt * 1000);
          if (!Number.isNaN(date.getTime())) {
            return date.toLocaleString("zh-CN", {
              month: "2-digit",
              day: "2-digit",
              hour: "2-digit",
              minute: "2-digit",
              hour12: false,
            });
          }
        }

        const resetAfterSeconds = normalizeNumber(window.reset_after_seconds || window.resetAfterSeconds);
        if (resetAfterSeconds !== null) {
          const date = new Date(Date.now() + resetAfterSeconds * 1000);
          if (!Number.isNaN(date.getTime())) {
            return date.toLocaleString("zh-CN", {
              month: "2-digit",
              day: "2-digit",
              hour: "2-digit",
              minute: "2-digit",
              hour12: false,
            });
          }
        }

        return "--";
      }

      function quotaFillClass(percent) {
        if (percent >= 80) return "high";
        if (percent >= 50) return "medium";
        return "low";
      }

      function getWindowSeconds(window) {
        if (!window || typeof window !== "object") return null;
        return normalizeNumber(window.limit_window_seconds || window.limitWindowSeconds);
      }

      function classifyCodexWindows(limitInfo, planType) {
        const primaryWindow = limitInfo && (limitInfo.primary_window || limitInfo.primaryWindow) || null;
        const secondaryWindow = limitInfo && (limitInfo.secondary_window || limitInfo.secondaryWindow) || null;
        const rawWindows = [primaryWindow, secondaryWindow];
        const fiveHourSeconds = 18000;
        const weeklySeconds = 604800;
        const supportsFiveHour = planType !== "free";

        let fiveHourWindow = null;
        let weeklyWindow = null;
        for (const window of rawWindows) {
          if (!window) continue;
          const seconds = getWindowSeconds(window);
          if (seconds === fiveHourSeconds && !fiveHourWindow) {
            fiveHourWindow = window;
          } else if (seconds === weeklySeconds && !weeklyWindow) {
            weeklyWindow = window;
          }
        }

        if (!fiveHourWindow && !weeklyWindow) {
          if (supportsFiveHour) {
            fiveHourWindow = primaryWindow || null;
            weeklyWindow = secondaryWindow || null;
          } else {
            weeklyWindow = primaryWindow || secondaryWindow || null;
          }
        }

        if (!supportsFiveHour) {
          fiveHourWindow = null;
        }

        return { fiveHourWindow, weeklyWindow };
      }

      function buildCodexQuotaWindows(payload, planType) {
        const windows = [];
        const addWindow = (group, id, label, window, limitReached, allowed) => {
          if (!window) return;
          const usedPercentRaw = normalizeNumber(window.used_percent || window.usedPercent);
          const exhausted = Boolean(limitReached) || allowed === false;
          const usedPercent = usedPercentRaw !== null ? usedPercentRaw : exhausted ? 100 : null;
          windows.push({
            group,
            id,
            label,
            usedPercent,
            resetLabel: formatQuotaResetLabel(window),
          });
        };

        const rateLimit = payload && (payload.rate_limit || payload.rateLimit) || null;
        const codeReviewLimit = payload && (payload.code_review_rate_limit || payload.codeReviewRateLimit) || null;

        const rateWindows = classifyCodexWindows(rateLimit, planType);
        addWindow("rate", "primary", "5 小时", rateWindows.fiveHourWindow, rateLimit && (rateLimit.limit_reached || rateLimit.limitReached), rateLimit && rateLimit.allowed);
        addWindow("rate", "weekly", "7 天", rateWindows.weeklyWindow, rateLimit && (rateLimit.limit_reached || rateLimit.limitReached), rateLimit && rateLimit.allowed);

        const reviewWindows = classifyCodexWindows(codeReviewLimit, planType);
        addWindow("review", "code-review-primary", "5 小时", reviewWindows.fiveHourWindow, codeReviewLimit && (codeReviewLimit.limit_reached || codeReviewLimit.limitReached), codeReviewLimit && codeReviewLimit.allowed);
        addWindow("review", "code-review-weekly", "7 天", reviewWindows.weeklyWindow, codeReviewLimit && (codeReviewLimit.limit_reached || codeReviewLimit.limitReached), codeReviewLimit && codeReviewLimit.allowed);

        return windows;
      }

      async function fetchCodexQuota(account) {
        const authIndex = normalizeString(account && account.auth_index);
        if (!authIndex) {
          throw new Error("认证文件缺少 auth_index");
        }
        const accountId = resolveCodexAccountId(account);
        if (!accountId) {
          throw new Error("Codex 凭证缺少 ChatGPT 账号 ID");
        }

        const result = await api("/v0/management/api-call", {
          method: "POST",
          body: JSON.stringify({
            auth_index: authIndex,
            method: "GET",
            url: "https://chatgpt.com/backend-api/wham/usage",
            header: {
              Authorization: "Bearer $TOKEN$",
              "Content-Type": "application/json",
              "User-Agent": "codex_cli_rs/0.76.0 (Debian 13.0.0; x86_64) WindowsTerminal",
              "Chatgpt-Account-Id": accountId,
            },
          }),
        });

        const statusCode = Number(result.status_code || result.statusCode || 0);
        if (statusCode < 200 || statusCode >= 300) {
          throw new Error(getAPICallErrorMessage(result));
        }

        const payload = parseJSONValue(result.body);
        if (!payload || typeof payload !== "object") {
          throw new Error("暂无额度数据");
        }

        const planType = normalizePlanType(payload.plan_type || payload.planType) || normalizePlanType(account && account.id_token && account.id_token.plan_type);

        return {
          planType,
          windows: buildCodexQuotaWindows(payload, planType),
        };
      }

      function api(path, options = {}) {
        const headers = new Headers(options.headers || {});
        if (state.key) {
          headers.set("X-Management-Key", state.key);
        }
        if (options.body && !(options.body instanceof FormData) && !headers.has("Content-Type")) {
          headers.set("Content-Type", "application/json");
        }

        return fetch(path, {
          method: options.method || "GET",
          headers,
          body: options.body,
        }).then(async (response) => {
          const text = await response.text();
          let payload = {};
          if (text) {
            try {
              payload = JSON.parse(text);
            } catch (error) {
              payload = { raw: text };
            }
          }
          if (!response.ok) {
            const message = payload.error || payload.raw || `${response.status} ${response.statusText}`;
            throw new Error(message);
          }
          return payload;
        });
      }

      function accountSummary() {
        const accounts = Array.isArray(state.accounts) ? state.accounts : [];
        const enabled = accounts.filter((account) => !account.disabled).length;
        const attention = accounts.filter((account) => account.disabled || account.unavailable || String(account.status || "").toLowerCase() === "error").length;
        const planCounts = {};

        accounts.forEach((account) => {
          const key = normalizePlanType(account && account.id_token && account.id_token.plan_type) || "unknown";
          planCounts[key] = (planCounts[key] || 0) + 1;
        });

        return {
          total: accounts.length,
          enabled,
          attention,
          planCounts,
        };
      }

      function dashboardPriorityState(summary, snapshot) {
        if (!summary.total) {
          return {
            level: "warn",
            pillClass: "warn",

        if (snapshot.deficit > 0) {

        if (summary.attention > 0) {

      function usageSummary() {
        const usage = state.usage && state.usage.usage ? state.usage.usage : null;
        const failedRequests = state.usage ? Number(state.usage.failed_requests || 0) : 0;
        const models = usage ? collectModelUsage(usage) : [];

        return {
          usage,
          totalRequests: usage ? Number(usage.total_requests || 0) : 0,
          successCount: usage ? Number(usage.success_count || 0) : 0,
          failureCount: usage ? Number(usage.failure_count || failedRequests) : failedRequests,
          totalTokens: usage ? Number(usage.total_tokens || 0) : 0,
          clientCount: usage ? Object.keys(usage.apis || {}).length : 0,
          models,
        };
      }

      function collectModelUsage(usage) {
        const results = [];
        const apis = usage && usage.apis ? usage.apis : {};
        const modelMap = new Map();

        Object.keys(apis).forEach((apiName) => {
          const api = apis[apiName] || {};
          const models = api.models || {};
          Object.keys(models).forEach((modelName) => {
            const current = modelMap.get(modelName) || { requests: 0, tokens: 0 };
            current.requests += Number(models[modelName].total_requests || 0);
            current.tokens += Number(models[modelName].total_tokens || 0);
            modelMap.set(modelName, current);
          });
        });

        modelMap.forEach((value, name) => {
          results.push({ name, requests: value.requests, tokens: value.tokens });
        });

        results.sort((left, right) => {
          if (right.requests !== left.requests) {
            return right.requests - left.requests;
          }
          return right.tokens - left.tokens;
        });

        return results;
      }

          state.configStatus = result.restart_required ? `配置已保存，以下字段需要重启后生效：${(result.restart_fields || []).join("、")}` : "配置已保存并已应用。";

        if (!ensureManagementKey("保存配置")) return;

        const payload = buildConfigPayloadFromDraft(state.configDraft);
        const nextSecret = payload.management.secretKey;

        state.configSaving = true;
        renderApp();

        try {
          const result = await api("/v0/management/config", {
            method: "PUT",
            body: JSON.stringify(payload),
          });

          if (nextSecret) {
            setKey(nextSecret);
          }
          state.configDraft = configDraftFromPayload(result.config);
          state.configSaving = false;
          state.configStatus = result.restart_required ? `配置已保存，以下字段需要重启后生效：${(result.restart_fields || []).join("、")}` : "配置已保存并已热生效。";
          state.configStatusLevel = result.restart_required ? "warn" : "ok";
          addLog(result.restart_required ? `配置已保存，需重启生效：${(result.restart_fields || []).join("、")}` : "配置已保存并已热生效");
          renderApp();
        } catch (error) {
          state.configSaving = false;
          state.configStatus = `保存配置失败：${error.message}`;
          state.configStatusLevel = "bad";
          renderApp();
          addLog(`保存配置失败：${error.message}`, "error");
        }
      }

      async function loadOverview(options = {}) {
        if (!state.key) {
          resetOverviewState();
          renderApp();
          return;
        }

        setBusy(true);
        try {
          const payload = await api("/v0/management/overview");

          state.accounts = payload.accounts || [];
          state.usage = {
            usage: payload.usage || null,
            failed_requests: Number(payload.failed_requests || 0),
          };
          state.replenishmentStatus = payload.replenishment || null;
          state.replenishmentError = payload.replenishment_error || "";
          state.replenishmentLoading = false;
          state.lastSync = new Date().toISOString();
          syncQuotaCache();
          renderApp();
          addLog(`已刷新概览：账号 ${state.accounts.length} 个，请求 ${payload.usage ? payload.usage.total_requests : 0} 次`);
        } catch (error) {
          renderApp();
          if (!options.silentError) {
            addLog(`刷新概览失败：${error.message}`, "error");
          }
          throw error;
        } finally {
          setBusy(false);
        }
      }

      async function loadReplenishmentStatus(options = {}) {
        if (!state.key) {
          state.replenishmentStatus = null;
          state.replenishmentError = "";
          state.replenishmentLoading = false;
          renderApp();
          return null;
        }

        state.replenishmentLoading = true;
        renderApp();
        try {
          const payload = await api("/v0/management/replenishment/status");
          state.replenishmentStatus = payload.replenishment || null;
          state.replenishmentError = "";
          if (!options.silentLog) {
            addLog("已刷新自动补号状态");
          }
          renderApp();
          return state.replenishmentStatus;
        } catch (error) {
          state.replenishmentStatus = null;
          state.replenishmentError = error.message || "补号状态读取失败";
          if (!options.silentLog) {
            addLog(`读取自动补号状态失败：${state.replenishmentError}`, "error");
          }
          renderApp();
          throw error;
        } finally {
          state.replenishmentLoading = false;
          renderApp();
        }
      }

      async function runReplenishment() {
        if (!ensureManagementKey("手动补号")) return;

        setBusy(true);
        try {
          const payload = await api("/v0/management/replenishment/run", {
            method: "POST",
          });
          state.replenishmentStatus = payload.replenishment || null;
          state.replenishmentError = "";
          renderApp();
          addLog("已触发补到目标值任务");
          await loadOverview({ silentError: true });
        } catch (error) {
          addLog(`触发补号失败：${error.message}`, "error");
        } finally {
          setBusy(false);
        }
      }

      async function authenticateKey(value, options = {}) {
        setKey(value);
        if (!state.key) {
          lockBackend("请输入管理密钥");
          renderApp();
          return false;
        }

        state.authChecking = true;
        state.authError = "";
        renderApp();

        try {
          await loadOverview({ silentError: Boolean(options.silentError) });
          state.authenticated = true;
          state.authChecking = false;
          state.authError = "";
          renderApp();
          loadWebConfig({ silentError: true, silentStatus: true }).catch(() => {});
          return true;
        } catch (error) {
          if (options.clearStoredOnError) {
            localStorage.removeItem(STORAGE_KEY);
          }
          const message = error && error.message ? error.message : "管理接口访问失败";
          lockBackend(message);
          renderApp();
          return false;
        }
      }

      async function loadUsageOnly() {

          state.usage = null;
          renderApp();
          return;
        }
        try {
          const payload = await api("/v0/management/usage");

          renderApp();
        } catch (error) {
          addLog(`拉取用量失败：${error.message}`, "error");

      async function importDirectory() {
        if (!ensureManagementKey("目录导入")) return;
        if (!state.importPath.trim()) {
          addLog("目录导入已跳过：服务器目录为空", "warn");

        }

        setBusy(true);
        try {

            method: "POST",
            body: JSON.stringify({
              path: state.importPath.trim(),

            }),
          });

      function collectSelectedFiles() {
        const files = [];
        const uploadFiles = document.getElementById("upload-files");
        const uploadDirectory = document.getElementById("upload-directory");
        [uploadFiles, uploadDirectory].forEach((input) => {
          if (!input || !input.files) return;
          Array.from(input.files).forEach((file) => files.push(file));
        });
        return files;
      }

      function fileSelectionSummary(inputId, emptyLabel) {
        const input = document.getElementById(inputId);
        if (!input || !input.files || !input.files.length) {
          return emptyLabel;
        }

        const files = Array.from(input.files);
        if (inputId === "upload-directory") {
          const first = files[0];
          const root = String(first.webkitRelativePath || first.name || "").split("/")[0] || "已选目录";
          return `${root} · ${files.length} 个文件`;
        }

        if (files.length === 1) {
          return files[0].name;
        }

        return `已选择 ${files.length} 个文件`;
      }

      function refreshUploadSummaries() {
        const filesSummary = document.getElementById("upload-files-summary");
        if (filesSummary) {
          filesSummary.textContent = fileSelectionSummary("upload-files", "未选择文件");
        }

        const directorySummary = document.getElementById("upload-directory-summary");
        if (directorySummary) {
          directorySummary.textContent = fileSelectionSummary("upload-directory", "未选择目录");
        }
      }

      async function uploadSelected() {
        if (!ensureManagementKey("文件上传")) return;

          addLog("上传已跳过：未选择任何文件", "warn");
          return;
        }

        form.append("cleanup_invalid", state.autoCleanup ? "true" : "false");
        files.forEach((file) => {
          form.append("files", file, file.name);
        });

        setBusy(true);
        try {
          const payload = await api("/v0/management/codex/import-files", {
            method: "POST",
            body: form,
          });

          state.accounts = payload.accounts || [];
          state.lastImportResult = payload;
          if (payload.cleanup) {
            state.lastCleanupResult = payload.cleanup;
          }
          state.lastSync = new Date().toISOString();
          syncQuotaCache();
          renderApp();
          addLog(`文件上传完成：新增 ${payload.imported || 0} 个，跳过 ${payload.skipped || 0} 个`);
          await loadUsageOnly();
        } catch (error) {
          addLog(`文件上传失败：${error.message}`, "error");
        } finally {
          setBusy(false);
        }
      }

        if (!ensureManagementKey("清理失效账号")) return;

      }

      async function refreshQuota(name, options = {}) {
        if (!ensureManagementKey("刷新额度")) return;

        const account = (state.accounts || []).find((item) => item && item.name === name);
        if (!account) return;
        const previousQuota = state.quotaByAccount[name] || null;
        const attemptAt = Date.now();

        state.quotaByAccount[name] = {
          status: previousQuota && Array.isArray(previousQuota.windows) && previousQuota.windows.length ? "success" : "loading",
          windows: previousQuota && Array.isArray(previousQuota.windows) ? previousQuota.windows : [],
          planType: normalizePlanType((previousQuota && previousQuota.planType) || (account && account.id_token && account.id_token.plan_type)),
          fetchedAt: previousQuota && previousQuota.fetchedAt ? previousQuota.fetchedAt : 0,
          refreshing: true,
          lastError: "",
        };
        renderApp();

        try {
          const quota = await fetchCodexQuota(account);
          state.quotaByAccount[name] = {
            status: "success",
            windows: quota.windows || [],
            planType: quota.planType || null,
            fetchedAt: attemptAt,
            refreshing: false,
            lastError: "",
          };
          renderApp();
          if (!options.silentLog) {
            addLog(`已刷新 ${name} 的 Codex 额度`);
          }
          return true;
        } catch (error) {
          const errorMessage = error && error.message ? error.message : "未知错误";
          const errorCopy = formatQuotaErrorCopy(errorMessage);
          const fallbackWindows = previousQuota && Array.isArray(previousQuota.windows) ? previousQuota.windows : [];
          const fallbackPlanType = normalizePlanType((previousQuota && previousQuota.planType) || (account && account.id_token && account.id_token.plan_type));
          if (fallbackWindows.length) {
            state.quotaByAccount[name] = {
              status: "success",
              windows: fallbackWindows,
              planType: fallbackPlanType,
              fetchedAt: attemptAt,
              refreshing: false,
              lastError: errorCopy.summary,
            };
          } else {
            state.quotaByAccount[name] = {
              status: "error",
              windows: [],
              planType: fallbackPlanType,
              error: errorMessage,
              fetchedAt: attemptAt,
              refreshing: false,
              lastError: errorCopy.summary,
            };
          }
          renderApp();
          if (!options.silentLog) {
            addLog(`刷新 ${name} 的额度失败：${errorCopy.summary}`, "error");
          }
          return false;
        }
      }

      async function refreshQuotaCollection(options = {}) {
        if (!ensureManagementKey("刷新额度")) return;
        if (state.quotaRefreshInFlight) return;

        const accounts = Array.isArray(options.accounts) ? options.accounts : filteredQuotaAccounts();
        const targets = accounts.filter((account) => account && account.name && (!options.onlyStale || quotaNeedsRefresh(account)));
        if (!targets.length) {
          if (!options.silentLog) {
            addLog("当前没有需要刷新的额度数据");
          }
          return;
        }

        state.quotaRefreshInFlight = true;
        renderApp();

        let refreshed = 0;
        let failed = 0;
        try {
          for (const account of targets) {
            const ok = await refreshQuota(account.name, { silentLog: true });
            if (ok) {
              refreshed += 1;
            } else {
              failed += 1;
            }
          }
          state.quotaLastBulkRefreshAt = Date.now();
          if (!options.silentLog) {
            addLog(`已刷新 ${refreshed} 个账号的额度${failed ? `，失败 ${failed} 个` : ""}`);
          }
        } finally {
          state.quotaRefreshInFlight = false;
          renderApp();
        }
      }

      function syncQuotaAutoRefresh(route) {
        if (!state.authenticated || route !== "quota" || document.hidden) {
          clearQuotaAutoRefresh();
          return;
        }

        if (!state.quotaAutoRefreshHandle) {
          state.quotaAutoRefreshHandle = window.setInterval(() => {
            if (document.hidden) {
              return;
            }
            refreshQuotaCollection({ onlyStale: true, silentLog: true });
          }, QUOTA_AUTO_REFRESH_INTERVAL_MS);
        }

        if (!state.quotaRefreshInFlight && filteredQuotaAccounts().some((account) => quotaNeedsRefresh(account))) {
          refreshQuotaCollection({ onlyStale: true, silentLog: true });
        }
      }

      async function deleteAccount(name) {
        if (!ensureManagementKey("删除账号")) return;
        if (!name) return;
        if (!window.confirm(`确定删除账号文件 ${name} 吗？`)) return;

        setBusy(true);
        try {
          await api(`/v0/management/codex/accounts/${encodeURIComponent(name)}`, {
            method: "DELETE",
          });

          delete state.quotaByAccount[name];
          addLog(`已删除账号文件：${name}`);
          await loadOverview();
        } catch (error) {
          addLog(`删除账号文件失败（${name}）：${error.message}`, "error");
        } finally {
          setBusy(false);
        }
      }

      function clearLogs() {
        state.logs = [];
        renderApp();
        addLog("本地操作日志已清空");
      }

      function filteredQuotaAccounts() {
        const query = state.quotaQuery.trim().toLowerCase();
        return (Array.isArray(state.accounts) ? state.accounts : []).filter((account) => {
          const badge = statusBadge(account);
          if (state.quotaStatusFilter === "ok" && badge.className !== "ok") {
            return false;
          }
          if (state.quotaStatusFilter === "attention" && badge.className === "ok") {
            return false;
          }
          if (!query) {
            return true;
          }
          const searchable = [
            account.email,
            account.label,
            account.name,
            account.path,
            resolvePlanLabel(account && account.id_token && account.id_token.plan_type),
          ]
            .filter(Boolean)
            .join(" ")
            .toLowerCase();
          return searchable.includes(query);
        });
      }

      function quotaMeter(window) {
        const remaining = window.usedPercent == null ? null : Math.max(0, Math.min(100, 100 - Number(window.usedPercent)));
        const percentLabel = remaining == null ? "100%" : `${Math.round(remaining)}%`;
        const fillWidth = remaining == null ? 100 : remaining;
        let unit = "--";
        if (String(window.label || "").includes("5")) {
          unit = "5H";
        } else if (String(window.label || "").includes("7") || String(window.label || "").includes("周")) {
          unit = "7D";
        }

        return `
          <div class="quota-meter">
            <div class="quota-meter-top">
              <strong>${escapeHTML(percentLabel)}</strong>
              <span class="quota-meter-time">${escapeHTML(window.resetLabel || "--")}</span>
              <span class="quota-meter-unit">${escapeHTML(unit)}</span>
            </div>
            <div class="quota-track">
              <div class="quota-fill ${quotaFillClass(fillWidth)}" style="width: ${fillWidth}%;"></div>
            </div>
          </div>
        `;
      }

      function quotaCellNote(quota) {
        if (!quota) return "";
        if (quota.refreshing) {
          return '<div class="quota-note warn">刷新中，显示上次结果</div>';
        }
        if (quota.lastError && Array.isArray(quota.windows) && quota.windows.length) {
          return '<div class="quota-note bad">刷新失败，保留上次结果</div>';
        }
        return "";
      }

      function findQuotaWindow(windows, preferredIds, labelHints) {
        const preferredIdSet = new Set(preferredIds || []);
        const idMatch = (windows || []).find((item) => preferredIdSet.has(item.id));
        if (idMatch) return idMatch;
        return (windows || []).find((item) => {
          const label = String(item && item.label || "");
          return (labelHints || []).some((hint) => label.includes(hint));
        }) || null;
      }

      function quotaWindowsForDisplay(account, quota) {
        const windows = Array.isArray(quota && quota.windows) ? quota.windows : [];
        if (!windows.length) return [];

        const rateWindows = windows.filter((item) => item && item.group === "rate");
        const source = rateWindows.length ? rateWindows : windows;
        const supportsPrimary = accountSupportsPrimaryQuota(account);

        const primaryWindow = supportsPrimary ? findQuotaWindow(source, ["primary"], ["5"]) : null;
        const weeklyWindow = findQuotaWindow(source, ["weekly"], ["7", "周"]);

        if (!supportsPrimary) {
          return weeklyWindow ? [weeklyWindow] : source.length ? [source[source.length - 1]] : [];
        }

        const results = [];
        if (primaryWindow) {
          results.push(primaryWindow);
        }
        if (weeklyWindow && weeklyWindow !== primaryWindow) {
          results.push(weeklyWindow);
        }
        if (results.length) {
          return results;
        }
        return source.slice(0, 2);
      }

      function renderQuotaSummaryCell(account) {
        const name = account && account.name ? String(account.name) : "";
        const quota = state.quotaByAccount[name];

        if (!state.key) {
          return '<div class="quota-placeholder">未连接</div>';
        }
        if (!resolveCodexAccountId(account)) {
          const copy = formatQuotaErrorCopy("缺少账号 ID");
          return `<div class="cell-message error" title="${escapeHTML(copy.detail || copy.summary)}">${escapeHTML(copy.summary)}</div>`;
        }
        if (!quota || quota.status === "idle") {
          return '<div class="quota-placeholder">等待刷新</div>';
        }
        if (quota.status === "loading" && (!Array.isArray(quota.windows) || !quota.windows.length)) {
          return '<div class="quota-placeholder">正在拉取额度...</div>';
        }
        if (quota.status === "error") {
          const copy = formatQuotaErrorCopy(quota.error || "刷新失败");
          return `<div class="cell-message error" title="${escapeHTML(copy.detail || copy.summary)}">${escapeHTML(copy.summary)}</div>`;
        }

        const windows = quotaWindowsForDisplay(account, quota);
        if (!windows.length) {
          return '<div class="quota-placeholder">暂无额度数据</div>';
        }

        return `
          <div class="quota-stack">
            <div class="quota-inline-grid${windows.length === 1 ? " single" : ""}">
              ${windows.map((window) => quotaMeter(window)).join("")}
            </div>
            ${quotaCellNote(quota)}
          </div>
        `;
      }

      function metricCard(label, value, helper, isSmall) {
        return `
          <article class="stat-card">
            <div class="stat-label">${escapeHTML(label)}</div>
            <div class="stat-value${isSmall ? " small" : ""}">${escapeHTML(value)}</div>
            ${helper ? `<div class="helper" style="margin-top:8px;">${escapeHTML(helper)}</div>` : ""}
          </article>
        `;
      }

      function replenishmentSnapshot() {
        const status = state.replenishmentStatus && typeof state.replenishmentStatus === "object" ? state.replenishmentStatus : {};
        const pool = status.pool && typeof status.pool === "object" ? status.pool : {};
        const healthy = Number(pool.healthy || 0);
        const warming = Number(pool.warming || 0);
        const reserved = Number(pool.reserved || 0);
        return {
          configured: Boolean(status.configured),
          serviceReady: Boolean(status.serviceReady),
          enabled: Boolean(status.enabled),
          target: Number(status.targetAccountCount || 0),
          deficit: Number(status.deficit || 0),
          usable: healthy + warming,
          healthy,
          warming,
          cooling: Number(pool.cooling || 0),
          invalid: Number(pool.invalid || 0),
          reserved,
          currentJob: status.currentJob || null,
          failureCount: Number(status.failureCount || 0),
          nextAttemptAt: status.nextAttemptAt || "",
        };
      }

      function renderReplenishmentPanel() {
        const snapshot = replenishmentSnapshot();
        const currentJob = snapshot.currentJob;
        const statusText = state.replenishmentLoading
          ? "正在读取补号状态。"
          : (state.replenishmentError || (
            !snapshot.configured
              ? "要启用自动补号，先在配置管理里填写 cdx-rt 服务地址和服务密钥。"
              : (snapshot.enabled
                ? "账号低于目标值时会自动补号。"
                : "当前不会自动补号，需要时可手动补到目标值。")
          ));
        const jobLabel = currentJob
          ? `当前任务 ${currentJob.status || "--"}，目标 ${currentJob.requestedSuccesses || 0}`
          : "当前没有补号任务";
        const nextAttemptLabel = snapshot.nextAttemptAt ? `${formatRelativeTime(snapshot.nextAttemptAt)} · ${formatTime(snapshot.nextAttemptAt)}` : "正常";

        return `
          <section class="table-shell">
            <div class="table-head">
              <div>
                <div class="section-kicker">自动补号</div>
                <div class="table-title">自动补号状态</div>
                <div class="helper" style="margin-top:6px;">${escapeHTML(statusText)}</div>
              </div>
              <div class="button-row">
                <button class="button button-secondary" data-action="refresh-replenishment" type="button">${state.replenishmentLoading ? "刷新中..." : "刷新补号状态"}</button>
              </div>
            </div>
            <section class="dashboard-metric-strip">
              <div class="dashboard-inline-metric">
                <div class="overview-label">目标账号</div>
                <strong>${formatCount(snapshot.target)}</strong>
                <div class="helper">当前配置值</div>
              </div>
              <div class="dashboard-inline-metric">
                <div class="overview-label">可用账号</div>
                <strong>${formatCount(snapshot.usable)}</strong>
                <div class="helper">健康 + 预热</div>
              </div>
              <div class="dashboard-inline-metric">
                <div class="overview-label">下一次尝试</div>
                <strong>${escapeHTML(nextAttemptLabel)}</strong>
                <div class="helper">${snapshot.failureCount ? `累计失败 ${formatCount(snapshot.failureCount)} 次` : "当前没有重试压力"}</div>
              </div>
            </section>
            <div class="meta-strip" style="margin-top:12px;">
              <span class="small-pill">${snapshot.serviceReady ? "补号服务已就绪" : (snapshot.configured ? "补号服务待就绪" : "补号服务未配置")}</span>
              <span class="small-pill">${snapshot.enabled ? "当前为自动模式" : "当前为手动模式"}</span>
              <span class="small-pill">${escapeHTML(jobLabel)}</span>
              <span class="small-pill">当前缺口 ${formatCount(snapshot.deficit)}${snapshot.reserved ? `，含预留 ${formatCount(snapshot.reserved)}` : ""}</span>
              <span class="small-pill">冷却 ${formatCount(snapshot.cooling)} / 异常 ${formatCount(snapshot.invalid)}</span>
            </div>
          </section>
        `;
      }

      function renderUsageTable(limit) {
        const usage = usageSummary();
        const models = usage.models.slice(0, limit);
        if (!models.length) {
          return '<div class="empty-box">当前没有请求记录。完成一次代理调用后，这里会显示模型用量。</div>';
        }

        const items = Array.isArray(pills) ? pills.filter(Boolean) : [];
        return `

      function formatLogLevel(level) {
        const normalized = String(level || "info").toLowerCase();
        if (normalized === "error") {
          return "错误";
        }
        if (normalized === "warn" || normalized === "warning") {
          return "警告";
        }
        if (normalized === "info") {
          return "信息";
        }
        return normalized;
      }
