                    <span>允许远程访问管理页</span>
                  </label>
                  <label class="switch-row">
                    <input data-config-field="tls.enable" type="checkbox" ${draft.tls.enable ? "checked" : ""} />
                    <span>启用 HTTPS</span>
                  </label>
                  <label class="field span-2">
                    <span class="field-label">管理密钥</span>
                    <input data-config-field="management.secretKey" type="password" value="${escapeHTML(draft.management.secretKey)}" placeholder="留空表示保持当前密钥" autocomplete="new-password" />
                  </label>
                  <label class="field">
                    <span class="field-label">证书路径</span>
                    <input data-config-field="tls.cert" type="text" value="${escapeHTML(draft.tls.cert)}" placeholder="/path/to/fullchain.pem" />
                  </label>
                  <label class="field">
                    <span class="field-label">私钥路径</span>
                    <input data-config-field="tls.key" type="text" value="${escapeHTML(draft.tls.key)}" placeholder="/path/to/privkey.pem" />
                  </label>
                </div>
              </article>
            </section>

            <article class="config-panel full">
              <div>
                <div class="section-kicker">客户端接入</div>
                <h3>客户端 API Key</h3>
                <div class="helper" style="margin-top:6px;">这里只放客户端访问 <span class="mono">/v1/*</span> 所需的密钥；每行一个，方便直接批量粘贴。</div>
              </div>
              <div class="config-form-grid">
                <label class="field span-2">
                  <span class="field-label">客户端 API Key</span>
                  <textarea data-config-field="apiKeysText" placeholder="每行一个 API Key">${escapeHTML(draft.apiKeysText)}</textarea>
                </label>
              </div>
            </article>

            <details class="config-advanced">
              <summary>展开进阶运行参数</summary>
              <div class="config-advanced-body">
                <article class="config-panel full">
                  <div>
                    <div class="section-kicker">运行策略</div>
                    <h3>日志、统计、重试与路由</h3>
                    <div class="helper" style="margin-top:6px;">这些项属于低频调优。默认值通常已经够用，只有在排障或调整路由策略时再改。</div>
                  </div>
                  <div class="config-form-grid">
                    <label class="switch-row">
                      <input data-config-field="usageStatisticsEnabled" type="checkbox" ${draft.usageStatisticsEnabled ? "checked" : ""} />
                      <span>启用用量统计</span>
                    </label>
                    <label class="switch-row">
                      <input data-config-field="requestLog" type="checkbox" ${draft.requestLog ? "checked" : ""} />
                      <span>记录代理请求日志</span>
                    </label>
                    <label class="switch-row">
                      <input data-config-field="loggingToFile" type="checkbox" ${draft.loggingToFile ? "checked" : ""} />
                      <span>把运行日志写入文件</span>
                    </label>
                    <label class="switch-row">
                      <input data-config-field="disableCooling" type="checkbox" ${draft.disableCooling ? "checked" : ""} />
                      <span>关闭额度冷却调度</span>
                    </label>
                    <div class="config-kv field span-2">
                      <label class="field">
                        <span class="field-label">日志总大小 MB</span>
                        <input data-config-field="logsMaxTotalSizeMB" type="number" min="0" value="${escapeHTML(draft.logsMaxTotalSizeMB)}" />
                      </label>
                      <label class="field">
                        <span class="field-label">错误日志保留数</span>
                        <input data-config-field="errorLogsMaxFiles" type="number" min="0" value="${escapeHTML(draft.errorLogsMaxFiles)}" />
                      </label>
                      <label class="field">
                        <span class="field-label">路由策略</span>
                        <select data-config-field="routingStrategy">
                          <option value="round-robin" ${draft.routingStrategy === "round-robin" ? "selected" : ""}>轮询</option>
                          <option value="fill-first" ${draft.routingStrategy === "fill-first" ? "selected" : ""}>填满优先</option>
                        </select>
                      </label>
                    </div>
                    <div class="config-kv field span-2">
                      <label class="field">
                        <span class="field-label">请求重试次数</span>
                        <input data-config-field="requestRetry" type="number" min="0" value="${escapeHTML(draft.requestRetry)}" />
                      </label>
                      <label class="field">
                        <span class="field-label">最大重试账号数</span>
                        <input data-config-field="maxRetryCredentials" type="number" min="0" value="${escapeHTML(draft.maxRetryCredentials)}" />
                      </label>
                      <label class="field">
                        <span class="field-label">最大重试等待秒数</span>
                        <input data-config-field="maxRetryInterval" type="number" min="0" value="${escapeHTML(draft.maxRetryInterval)}" />
                      </label>
                    </div>
                  </div>
                </article>
              </div>
            </details>

            <details class="config-advanced" ${replenishmentOpen ? "open" : ""}>
              <summary>展开自动补号设置</summary>
              <div class="config-advanced-body">
                <article class="config-panel full">
                  <div>
                    <div class="section-kicker">自动补号</div>
                    <h3>账号池联动</h3>
                    <div class="helper" style="margin-top:6px;">由 CPA 负责维持目标账号数，并通过内网调用 cdx-rt。只有需要联动补号时才需要填写这部分。</div>
                  </div>
                  <div class="config-form-grid">
                    <label class="switch-row">
                      <input data-config-field="replenishment.enabled" type="checkbox" ${draft.replenishment.enabled ? "checked" : ""} />
                      <span>启用自动补号</span>
                    </label>
                    <label class="switch-row">
                      <input data-config-field="replenishment.cleanupInvalidAccounts" type="checkbox" ${draft.replenishment.cleanupInvalidAccounts ? "checked" : ""} />
                      <span>补号前自动清理异常账号</span>
                    </label>
                    <label class="field">
                      <span class="field-label">目标可用账号数</span>
                      <input data-config-field="replenishment.targetAccountCount" type="number" min="1" value="${escapeHTML(draft.replenishment.targetAccountCount)}" />
                    </label>
                    <label class="field">
                      <span class="field-label">补号检查间隔（秒）</span>
                      <input data-config-field="replenishment.checkIntervalSeconds" type="number" min="1" value="${escapeHTML(draft.replenishment.checkIntervalSeconds)}" />
                    </label>
                    <label class="field">
                      <span class="field-label">额度巡检间隔（秒）</span>
                      <input data-config-field="replenishment.quotaRefreshIntervalSeconds" type="number" min="1" value="${escapeHTML(draft.replenishment.quotaRefreshIntervalSeconds)}" />
                    </label>
                    <label class="field span-2">
                      <span class="field-label">cdx-rt 服务地址</span>
                      <input data-config-field="replenishment.serviceUrl" type="text" value="${escapeHTML(draft.replenishment.serviceUrl)}" placeholder="http://cdx-rt:3080" />
                    </label>
                    <label class="field span-2">
                      <span class="field-label">cdx-rt 服务密钥</span>
                      <input data-config-field="replenishment.serviceToken" type="password" value="" placeholder="${draft.replenishment.serviceTokenConfigured ? "留空表示保持当前密钥" : "首次配置时填写"}" autocomplete="new-password" />
                    </label>
                  </div>
                </article>
              </div>
            </details>

            <article class="config-panel full config-save-panel">
              <div class="config-status ${statusLevel ? statusLevel : ""}">${escapeHTML(statusText)}</div>
              <div class="button-row">
                <button class="button button-primary" data-action="save-config" type="button" ${saving || loading ? "disabled" : ""}>${saving ? "正在保存..." : "保存配置"}</button>
                <button class="button button-secondary" data-action="reload-config" type="button" ${saving ? "disabled" : ""}>重新读取配置</button>
              </div>
            </article>
          </section>
        `;
      }

      function renderBootstrapEditor() {
        const draft = cloneConfigDraft(state.configDraft);
        const statusText = state.bootstrapSaving
          ? "正在写入首次配置并切换到正式管理模式。"
          : (state.bootstrapError || "首次启动只需要先设置管理密钥。进入后台后再继续补充监听、代理和客户端配置。");
        const statusLevel = state.bootstrapError ? "bad" : (state.bootstrapSaving ? "warn" : "ok");

        return `
          <section class="config-grid bootstrap-simple-grid">
            <article class="config-panel bootstrap-simple-panel">
              <div>
                <div class="section-kicker">首次配置</div>
                <h3>设置管理密钥</h3>
                <div class="helper" style="margin-top:6px;">保存后会自动生成正式配置并直接进入后台。其他设置项稍后再补，不影响先完成初始化。</div>
              </div>
              <div class="config-form-grid">
                <label class="field span-2">
                  <span class="field-label">管理密钥</span>
                  <input data-config-field="management.secretKey" type="password" value="${escapeHTML(draft.management.secretKey)}" placeholder="首次配置必须填写" autocomplete="new-password" />
                </label>
              </div>
              <div class="config-status ${statusLevel}">${escapeHTML(statusText)}</div>
              <div class="button-row">
                <button class="button button-primary" data-action="save-bootstrap-config" type="button" ${state.bootstrapSaving ? "disabled" : ""}>
                  ${state.bootstrapSaving ? "正在初始化..." : "完成首次配置"}
                </button>
              </div>
            </article>
          </section>
        `;
      }

      function renderConfigView() {
        return renderConfigEditor("config");
      }

      function renderLogsView() {
        const summary = accountSummary();
        const usage = usageSummary();
        const cachedQuotaCount = Object.values(state.quotaByAccount).filter((item) => item && item.status === "success").length;

        return `
          <section class="table-shell">
            <div class="table-head">
              <div>
                <div class="section-kicker">完整日志</div>
                <div class="table-title">操作日志</div>
                <div class="helper" style="margin-top:6px;">这里记录前端触发过的导入、刷新、删除和清理结果，适合快速确认刚才发生了什么。</div>
              </div>
              <div class="button-row">
                <button class="button button-secondary" data-action="refresh-overview" type="button">刷新整体状态</button>
                <button class="button button-secondary" data-action="clear-logs" type="button">清空日志</button>
              </div>
            </div>
            <div class="meta-strip" style="margin-bottom:12px;">
              <span class="small-pill">日志 ${formatCount(state.logs.length)} 条</span>
              <span class="small-pill">账号 ${formatCount(summary.total)} 个</span>
              <span class="small-pill">缓存额度 ${formatCount(cachedQuotaCount)} 个</span>
              <span class="small-pill">累计请求 ${formatCount(usage.totalRequests)} 次</span>
            </div>
            <div id="full-log-list">${renderLogsTable()}</div>
          </section>
        `;
      }

      function renderBootstrapShell() {
        const visible = state.bootstrapChecked && state.bootstrapRequired;
        elements.bootstrapShell.hidden = !visible;
        if (!visible) {
          elements.bootstrapShell.innerHTML = "";
          return;
        }
        elements.authShell.hidden = true;
        elements.backendShell.hidden = true;
        elements.bootstrapShell.innerHTML = `
          <section class="bootstrap-panel">
            <div class="auth-copy">
              <div class="section-kicker">首次初始化</div>
              <h1 class="auth-title">完成基础配置后进入后台</h1>
              <p class="auth-description">当前还没有正式配置。先设置管理密钥进入后台，其他代理参数稍后再补即可。</p>
            </div>
            ${renderBootstrapEditor()}
          </section>
        `;
      }

      function renderAuthShell() {
        const backendVisible = state.authenticated && !state.bootstrapRequired;
        const authVisible = !backendVisible && !state.bootstrapRequired;
        elements.authShell.hidden = !authVisible;
        elements.backendShell.hidden = !backendVisible;

        if (!authVisible) {
          return;
        }

        if (document.activeElement !== elements.authKeyInput) {
          elements.authKeyInput.value = state.key;
        }

        elements.authSubmit.textContent = state.authChecking ? "正在验证..." : "进入后台";
        elements.authClear.disabled = !state.key;

        let statusClass = "auth-status";
        let statusText = "输入管理密钥后会自动进入后台；已保存的密钥下次会自动重试。";

        if (!state.bootstrapChecked) {
          statusClass += " warn";
          statusText = "正在检查系统是否已经完成首次初始化。";
        } else if (state.bootstrapError) {
          statusClass += " bad";
          statusText = state.bootstrapError;
        } else if (state.authChecking) {
          statusClass += " warn";
          statusText = "正在验证管理密钥，请稍候。";
        } else if (state.authError) {
          statusClass += " bad";
          statusText = state.authError;
        } else if (state.key) {
          statusClass += " warn";
          statusText = "检测到已保存的管理密钥，验证通过后会直接进入后台。";
        }

        elements.authStatus.className = statusClass;
        elements.authStatus.textContent = statusText;
      }

      function updateShell() {
        const route = getRoute();
        const meta = ROUTES[route];
        const summary = accountSummary();
        const usage = usageSummary();

        elements.pageTitle.textContent = meta.title;
        elements.pageDescription.textContent = meta.description;
        elements.quickAccounts.textContent = formatCount(summary.total);
        elements.quickEnabled.textContent = formatCount(summary.enabled);
        elements.quickRequests.textContent = formatCount(usage.totalRequests);
        elements.quickSync.textContent = state.lastSync ? formatRelativeTime(state.lastSync) : "未同步";

        elements.navLinks.forEach((link) => {
          link.classList.toggle("active", link.dataset.routeLink === route);
        });
      }

      function renderView() {
        if (!state.authenticated) {
          return;
        }

        const route = getRoute();
        const renderer = {
          dashboard: renderDashboardView,
          quota: renderQuotaView,
          import: renderImportView,
          config: renderConfigView,
          logs: renderLogsView,
        }[route];

        elements.view.dataset.route = route;
        elements.view.innerHTML = renderer ? renderer() : renderDashboardView();
        applyBusyState();
      }

      function renderApp() {
        const route = getRoute();
        renderBootstrapShell();
        renderAuthShell();
        if (state.bootstrapRequired || !state.authenticated) {
          syncQuotaAutoRefresh("");
          applyBusyState();
          return;
        }
        updateShell();
        renderView();
        syncQuotaAutoRefresh(route);
      }

      elements.authForm.addEventListener("submit", async (event) => {
        event.preventDefault();
        const ok = await authenticateKey(elements.authKeyInput.value);
        if (ok) {
          addLog("管理密钥验证通过，已进入后台");
        }
      });

      elements.authClear.addEventListener("click", () => {
        setKey("");
        lockBackend("");
        renderApp();
        addLog("浏览器中的管理密钥已清除");
      });

      document.getElementById("mobile-menu").addEventListener("click", () => {
        elements.body.classList.toggle("nav-open");
      });

      document.getElementById("drawer-backdrop").addEventListener("click", () => {
        elements.body.classList.remove("nav-open");
      });

      elements.navLinks.forEach((link) => {
        link.addEventListener("click", () => {
          elements.body.classList.remove("nav-open");
        });
      });

      document.addEventListener("keydown", (event) => {
        if (event.key === "Escape") {
          elements.body.classList.remove("nav-open");
        }
      });

      document.addEventListener("click", (event) => {
        const button = event.target.closest("button");
        if (!button) return;

        if (button.dataset.action === "pick-files") {
          const input = document.getElementById("upload-files");
          if (input) input.click();
          return;
        }
        if (button.dataset.action === "pick-directory") {
          const input = document.getElementById("upload-directory");
          if (input) input.click();
          return;
        }
        if (button.dataset.action === "refresh-overview") {
          loadOverview().catch(() => {});
          return;
        }
        if (button.dataset.action === "refresh-replenishment") {
          loadReplenishmentStatus().catch(() => {});
          return;
        }
        if (button.dataset.action === "run-replenishment") {
          runReplenishment();
          return;
        }
        if (button.dataset.action === "refresh-quota-all") {
          refreshQuotaCollection();
          return;
        }
        if (button.dataset.action === "cleanup-invalid") {
          cleanupInvalid();
          return;
        }
        if (button.dataset.action === "clear-logs") {
          clearLogs();
          return;
        }
        if (button.dataset.action === "save-bootstrap-config") {
          saveBootstrapConfig();
          return;
        }
        if (button.dataset.action === "save-config") {
          saveWebConfig();
          return;
        }
        if (button.dataset.action === "reload-config") {
          loadWebConfig().catch(() => {});
          return;
        }
        if (button.id === "import-directory") {
          importDirectory();
          return;
        }
        if (button.id === "upload-selected") {
          uploadSelected();
          return;
        }
        if (button.dataset.refreshQuota) {
          refreshQuota(button.dataset.refreshQuota);
          return;
        }
        if (button.dataset.delete) {
          deleteAccount(button.dataset.delete);
        }
      });

      document.addEventListener("input", (event) => {
        if (event.target && event.target.id === "import-path") {
          setImportPath(event.target.value);
        }
        if (event.target && event.target.id === "quota-query") {
          setQuotaQuery(event.target.value);
          renderApp();
        }
        if (event.target && event.target.dataset && event.target.dataset.configField) {
          setConfigField(event.target.dataset.configField, event.target.value);
        }
      });

      document.addEventListener("change", (event) => {
        if (event.target && event.target.id === "auto-cleanup") {
          setAutoCleanup(event.target.checked);
        }
        if (event.target && (event.target.id === "upload-files" || event.target.id === "upload-directory")) {
          refreshUploadSummaries();
        }
        if (event.target && event.target.id === "quota-status-filter") {
          setQuotaStatusFilter(event.target.value);
          renderApp();
        }
        if (event.target && event.target.dataset && event.target.dataset.configField) {
          const inputType = String(event.target.type || "").toLowerCase();
          const value = inputType === "checkbox" ? Boolean(event.target.checked) : event.target.value;
          setConfigField(event.target.dataset.configField, value);
          renderApp();
        }
      });

      window.addEventListener("hashchange", () => {
        elements.body.classList.remove("nav-open");
        renderApp();
      });

      document.addEventListener("visibilitychange", () => {
        if (document.hidden) {
          syncQuotaAutoRefresh("");
          return;
        }
        renderApp();
      });

      ensureRoute();
      addLog("Codex 控制台已就绪");
      renderApp();
      checkBootstrapStatus({ silentError: true }).then((payload) => {
        if (payload && payload.bootstrap_required) {
          addLog("检测到首次初始化模式，请先完成配置", "warn");
          return;
        }
        if (state.key) {
          authenticateKey(state.key, { silentError: true, clearStoredOnError: true }).then((ok) => {
            if (!ok) {
              addLog("已保存的管理密钥验证失败，请重新输入", "warn");
            }
          });
        } else {
          renderApp();
        }
      }).catch(() => {});
    </script>
  </body>
</html>
