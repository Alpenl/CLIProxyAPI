# Optional manual configuration for Codex-first mode.
# The server can now start without any config file and create a bootstrap config
# automatically. Use this sample only when you want to pre-write the config.

# Bind host/interface. Leave empty to listen on all interfaces.
host: ""

# Main API port.
port: 8317

tls:
  enable: false
  cert: ""
  key: ""

remote-management:
  # Keep false if you only access /management.html from localhost.
  allow-remote: false

  # Plaintext is accepted here and will be bcrypt-hashed on startup.
  # The same key is required by the embedded web console.
  secret-key: "change-this-management-key"

# Directory that stores Codex OAuth JSON files.
# You can import files here from the web console or copy them in directly.
auth-dir: "~/.cli-proxy-api"

# Downstream clients authenticate with one of these keys.
api-keys:
  - "change-this-api-key"

debug: false

logging-to-file: false
logs-max-total-size-mb: 0
error-logs-max-files: 10
usage-statistics-enabled: true

# Global upstream proxy. Leave empty for direct access.
proxy-url: ""
passthrough-headers: false

# Retry behavior for Codex account pool failover.
request-retry: 3
max-retry-credentials: 0
max-retry-interval: 30

routing:
  strategy: "round-robin"

nonstream-keepalive-interval: 0

# Optional defaults for file-backed Codex OAuth accounts.
# Uncomment when your client omits the official headers and you need to pin them.
# codex-header-defaults:
#   user-agent: "codex_cli_rs/0.114.0 (Mac OS 14.2.0; x86_64) vscode/1.111.0"
#   beta-features: "multi_agent"
